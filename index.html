<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digi - Ultimate King of the Hill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="overlay">
  <main class="wrap">
    <header class="head">
      <div class="eyebrow">Digi Presents</div>
      <h1>Ultimate King of the Hill</h1>
    </header>

    <nav class="tabs" aria-label="KOTH stages">
      <button class="tab active" data-stage="sub" type="button">Paid Subs + Gifters</button>
      <button class="tab" data-stage="non" type="button">Non-Sub KOTH</button>
      <button class="tab" data-stage="final" type="button">Final Battle</button>
    </nav>

    <section id="app" aria-live="polite"></section>
    <p class="foot" id="syncStatus">Connecting live scores...</p>
  </main>

  <script type="module" src="overlay.js"></script>
</body>
</html>
